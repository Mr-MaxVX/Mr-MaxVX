<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 159" width="900" height="159" role="img"><title>GitHub activity</title>
<defs>
  <filter id="glow" x="-5%" y="-5%" width="110%" height="110%">
    <feGaussianBlur stdDeviation="1.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1.6" fill="#000" opacity=".35"/>
  </pattern>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".7"/>
  </radialGradient>
  <radialGradient id="tint" cx="50%" cy="40%" r="70%">
    <stop offset="0%" stop-color="#39ff14" stop-opacity=".07"/>
    <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#39ff14" stop-opacity="0"/>
    <stop offset="50%" stop-color="#39ff14" stop-opacity=".09"/>
    <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  text{font-family:'Courier New','DejaVu Sans Mono','Liberation Mono',Consolas,monospace;font-size:14.5px;white-space:pre}
  .b{fill:#39ff14;font-weight:bold} .m{fill:#1fe03a} .d{fill:#14873a}
  .p{fill:#39ff14} .t{fill:#14873a;font-size:13px}
  .crt{animation:flick 6s infinite}
  @keyframes flick{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.93}49%{opacity:1}82%{opacity:.97}}
  .cur{animation:blink 1.06s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .beam{animation:roll 7s linear infinite}
  @keyframes roll{from{transform:translateY(-120px)}to{transform:translateY(var(--h))}}
  
</style>
<rect width="900" height="159" rx="14" fill="#030703"/>
<rect x="1" y="1" width="898" height="157" rx="13" fill="#061006" stroke="#39ff14" stroke-opacity=".35"/>
<rect x="1" y="1" width="898" height="38" rx="13" fill="#0a1a0a"/>
<rect x="1" y="26" width="898" height="12" fill="#0a1a0a"/>
<line x1="1" y1="38" x2="899" y2="38" stroke="#39ff14" stroke-opacity=".25"/>
<circle cx="24" cy="19.0" r="5.5" fill="#39ff14"/><circle cx="44" cy="19.0" r="5.5" fill="#1fe03a" opacity=".6"/><circle cx="64" cy="19.0" r="5.5" fill="#14873a" opacity=".6"/>
<text x="450.0" y="23.5" text-anchor="middle" class="t">~/activity — htop</text>
<g class="crt" filter="url(#glow)">
<text x="34.0" y="72" class="p">bassam@uqu:~$ git log --author=Mr-MaxVX --stats</text>
<text x="34.0" y="106" class="d">&gt; streaming live commit telemetry from github.com/Mr-MaxVX ...</text>
<text x="34" y="133" class="p">bassam@uqu:~$</text>
<rect class="cur" x="155.8" y="120" width="8.7" height="16" fill="#39ff14"/>
</g>
<rect y="38" width="900" height="121" fill="url(#tint)"/>
<rect class="beam" style="--h:159px" width="900" height="120" fill="url(#beam)"/>
<rect width="900" height="159" rx="14" fill="url(#scan)"/>
<rect width="900" height="159" rx="14" fill="url(#vig)"/>
</svg>